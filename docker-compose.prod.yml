# Full stack: infra + API + worker + web
# Usage:
#   copy .env.docker.example .env   # edit GACHIFY_PUBLIC_URL and secrets
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Open: ${GACHIFY_PUBLIC_URL}  (default http://localhost)

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gachify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gachify}
      POSTGRES_DB: ${POSTGRES_DB:-gachify}

  minio-init:
    volumes:
      - ./deploy/minio-init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gachify}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gachifysecret}
      GACHIFY_S3_BUCKET_MASTERS: ${GACHIFY_S3_BUCKET_MASTERS:-gachify-masters}
      GACHIFY_CORS_ORIGINS: ${GACHIFY_CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173}
    entrypoint: ["/bin/sh", "/init.sh"]

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: migrate
    container_name: gachify-migrate
    environment:
      GACHIFY_DATABASE_URL: postgres://${POSTGRES_USER:-gachify}:${POSTGRES_PASSWORD:-gachify}@postgres:5432/${POSTGRES_DB:-gachify}?sslmode=disable
      GACHIFY_MIGRATIONS_PATH: /migrations
      GACHIFY_MIGRATE_CMD: up
      GACHIFY_JWT_SECRET: ${GACHIFY_JWT_SECRET:?Set GACHIFY_JWT_SECRET in .env (min 32 chars)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    container_name: gachify-api
    env_file:
      - path: .env
        required: false
    environment:
      GACHIFY_ENV: ${GACHIFY_ENV:-production}
      GACHIFY_HTTP_ADDR: :8080
      GACHIFY_DATABASE_URL: postgres://${POSTGRES_USER:-gachify}:${POSTGRES_PASSWORD:-gachify}@postgres:5432/${POSTGRES_DB:-gachify}?sslmode=disable
      GACHIFY_REDIS_URL: redis://redis:6379/0
      GACHIFY_S3_ENDPOINT: http://minio:9000
      GACHIFY_S3_PUBLIC_ENDPOINT: ${GACHIFY_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      GACHIFY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gachify}
      GACHIFY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gachifysecret}
      GACHIFY_S3_BUCKET_MASTERS: ${GACHIFY_S3_BUCKET_MASTERS:-gachify-masters}
      GACHIFY_S3_PATH_STYLE: "true"
      GACHIFY_JWT_SECRET: ${GACHIFY_JWT_SECRET:?Set GACHIFY_JWT_SECRET in .env (min 32 chars)}
      GACHIFY_SEED_SECRET: ${GACHIFY_SEED_SECRET:?Set GACHIFY_SEED_SECRET in .env}
      GACHIFY_CORS_ORIGINS: ${GACHIFY_CORS_ORIGINS:-http://localhost}
      GACHIFY_PUBLIC_API_URL: ${GACHIFY_PUBLIC_API_URL:-http://localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - default

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: worker
    container_name: gachify-worker
    env_file:
      - path: .env
        required: false
    environment:
      GACHIFY_ENV: ${GACHIFY_ENV:-production}
      GACHIFY_DATABASE_URL: postgres://${POSTGRES_USER:-gachify}:${POSTGRES_PASSWORD:-gachify}@postgres:5432/${POSTGRES_DB:-gachify}?sslmode=disable
      GACHIFY_REDIS_URL: redis://redis:6379/0
      GACHIFY_S3_ENDPOINT: http://minio:9000
      GACHIFY_S3_PUBLIC_ENDPOINT: ${GACHIFY_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      GACHIFY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gachify}
      GACHIFY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gachifysecret}
      GACHIFY_S3_BUCKET_MASTERS: ${GACHIFY_S3_BUCKET_MASTERS:-gachify-masters}
      GACHIFY_S3_PATH_STYLE: "true"
      GACHIFY_JWT_SECRET: ${GACHIFY_JWT_SECRET:?Set GACHIFY_JWT_SECRET in .env (min 32 chars)}
      GACHIFY_PUBLIC_API_URL: ${GACHIFY_PUBLIC_API_URL:-http://localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gachify-web
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: gachify-caddy
    ports:
      - "${GACHIFY_HTTP_PORT:-80}:80"
      - "${GACHIFY_HTTPS_PORT:-443}:443"
    environment:
      GACHIFY_DOMAIN: ${GACHIFY_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gachify_caddy_data:/data
      - gachify_caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: deploy/Dockerfile.seed
    container_name: gachify-seed
    environment:
      GACHIFY_SEED_API_URL: http://api:8080
      GACHIFY_SEED_WAIT_SEC: ${GACHIFY_SEED_WAIT_SEC:-120}
      GACHIFY_SEED_SECRET: ${GACHIFY_SEED_SECRET:?Set GACHIFY_SEED_SECRET in .env}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  gachify_caddy_data:
  gachify_caddy_config:
