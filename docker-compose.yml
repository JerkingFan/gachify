services:
  postgres:
    image: postgres:16-alpine
    container_name: gachify-postgres
    environment:
      POSTGRES_USER: gachify
      POSTGRES_PASSWORD: gachify
      POSTGRES_DB: gachify
    ports:
      - "5432:5432"
    volumes:
      - gachify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gachify -d gachify"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gachify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: gachify-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gachify
      MINIO_ROOT_PASSWORD: gachifysecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gachify_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: gachify-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 gachify gachifysecret;
      mc mb local/gachify-masters --ignore-existing;
      mc mb local/gachify-public --ignore-existing;
      printf '%s' '[{\"AllowedOrigins\":[\"http://localhost:5173\",\"http://127.0.0.1:5173\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]' > /tmp/cors.json;
      mc cors set local/gachify-masters /tmp/cors.json || true;
      exit 0;
      "

volumes:
  gachify_pgdata:
  gachify_minio:
