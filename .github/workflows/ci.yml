name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        env:
          INTEGRATION: "1"
        run: go test ./internal/modules/catalog/... ./internal/modules/auth/... ./internal/modules/admin/... -count=1 -timeout 5m

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --timeout=5m

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate API types from OpenAPI
        run: npm run gen:api-types

      - name: Verify generated API types are committed
        run: git diff --exit-code src/api/generated/

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: E2E smoke (compose + migrate + seed)
        run: sh scripts/smoke-e2e.sh

  e2e-web:
    runs-on: ubuntu-latest
    needs: [smoke]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start stack for Playwright
        working-directory: .
        run: |
          docker compose -f docker-compose.yml up -d --wait postgres redis minio minio-init
          GACHIFY_DATABASE_URL=postgres://gachify:gachify@localhost:5432/gachify?sslmode=disable \
            go run ./cmd/migrate -cmd up
          GACHIFY_ENV=development \
          GACHIFY_DATABASE_URL=postgres://gachify:gachify@localhost:5432/gachify?sslmode=disable \
          GACHIFY_REDIS_URL=redis://localhost:6379/0 \
          GACHIFY_S3_ENDPOINT=http://localhost:9000 \
          GACHIFY_MODERATION_ENABLED=true \
          GACHIFY_ADMIN_SECRET=e2e-admin-secret \
          go run ./cmd/api &
          echo $! > /tmp/gachify-api.pid
          GACHIFY_SEED_API_URL=http://localhost:8080 sh deploy/seed.sh

      - name: Install web deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E
        env:
          GACHIFY_E2E_API_URL: http://localhost:8080
          GACHIFY_E2E_WEB_URL: http://localhost:5173
          GACHIFY_E2E_ADMIN_SECRET: e2e-admin-secret
        run: npm run test:e2e

      - name: Stop stack
        if: always()
        working-directory: .
        run: |
          kill $(cat /tmp/gachify-api.pid 2>/dev/null) 2>/dev/null || true
          docker compose -f docker-compose.yml down -v
